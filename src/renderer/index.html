<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!--
      BOUNDARY-002 CSP: no inline/remote scripts (script-src 'self';
      'unsafe-eval' kept for vega expression compilation — tighten in
      Phase 7). Local document images load via the controlled vien-asset:
      protocol; file: stays allowed for raw-HTML images in packaged builds.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' vien-asset: data: blob: file: http: https:; font-src 'self' data: file:; connect-src 'self' https: http: ws: data: blob:; media-src 'self' vien-asset: data: file:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'self' blob:">
    <script src="./boot.js"></script>
    <link rel="icon" href="./assets/images/logo.png">
    <title>Vien</title>
    <style>
      :root {
        --loading-bg: rgb(248, 244, 238);
        --loading-mark: rgba(56, 48, 39, 0.62);
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        overflow: hidden;
      }

      #loading-page {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--loading-bg);
        -webkit-app-region: drag;
        opacity: 1;
        transition: opacity 90ms ease-out;
      }

      #loading-page.is-leaving {
        opacity: 0;
      }

      .loading-stage {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        letter-spacing: 0.08em;
      }

      .loading-logo {
        width: 24px;
        height: 24px;
        border-radius: 8px;
      }

      .loading-wordmark {
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        color: var(--loading-mark);
      }

      @media (prefers-reduced-motion: reduce) {
        #loading-page {
          transition: none;
        }
      }
    </style>
  </head>
  <body autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <!-- Vue app -->
    <div id="app"></div>

    <!-- Loading page on application startup -->
    <div id="loading-page">
      <div class="loading-stage">
        <img class="loading-logo" src="./assets/images/logo.png" alt="Vien logo">
        <div class="loading-wordmark">Vien</div>
      </div>
    </div>

    <!-- Renderer entry point — Vite injects the bundled script here -->
    <script type="module" src="/main.js"></script>
  </body>
</html>
