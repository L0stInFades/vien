name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Newest release toolchain (rolling)
        run: Scripts/update-toolchain.sh
      - name: Swift version
        run: Scripts/swift.sh --version
      - name: Tests (spec conformance, corpus, incremental, diagrams, math)
        run: Scripts/swift.sh test --parallel
      - name: Perf and renders
        run: |
          Scripts/swift.sh build -c release --product vien-tool
          .build/release/vien-tool perf diagrams math
      - name: App bundle (arm64 + x86_64)
        run: UNIVERSAL=1 Scripts/bundle.sh release
      - name: Headless export smoke
        run: |
          dist/Vien.app/Contents/MacOS/Vien --export html README.md /tmp/readme.html
          dist/Vien.app/Contents/MacOS/Vien --export pdf README.md /tmp/readme.pdf
          test -s /tmp/readme.html && test -s /tmp/readme.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: Vien.app
          path: dist/Vien.app
