name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis, unit tests, spec tests and production build on Linux.
  checks:
    name: Lint, typecheck, unit, specs, build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install build dependencies
        #                electron-builder | keyboard-layout | keytar | fontmanager
        run: |
          sudo apt-get -y update
          sudo apt-get install -y icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Typecheck (tsc)
        run: pnpm run typecheck

      - name: Validate licenses
        run: pnpm run validate-licenses

      - name: Unit tests (Vitest)
        run: pnpm run unit

      - name: CommonMark and GFM specs
        run: pnpm run test:specs

      - name: Production build (electron-vite)
        run: pnpm run electron:build

  # Real Electron end-to-end smoke on macOS.
  electron-smoke:
    name: Electron E2E smoke (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      MARKTEXT_EXIT_ON_ERROR: 1

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build (electron-vite)
        run: pnpm run electron:build

      - name: Run Electron end-to-end tests
        run: pnpm exec playwright test -c test/e2e/playwright.config.js test/e2e

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
