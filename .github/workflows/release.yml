name: release

on:
  push:
    tags: ["native-v*"]

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Newest release toolchain (rolling)
        run: Scripts/update-toolchain.sh
      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci /tmp/ci.keychain-db
          security set-keychain-settings -lut 21600 /tmp/ci.keychain-db
          security unlock-keychain -p ci /tmp/ci.keychain-db
          security import /tmp/cert.p12 -k /tmp/ci.keychain-db -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci /tmp/ci.keychain-db
          security list-keychains -d user -s /tmp/ci.keychain-db login.keychain-db
      - name: Build (arm64 + x86_64), sign, notarize, package
        env:
          UNIVERSAL: "1"
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          REQUIRE_NOTARIZATION: ${{ secrets.SIGN_IDENTITY != '' && '1' || '0' }}
        run: Scripts/release.sh "${GITHUB_REF_NAME#native-v}" "$GITHUB_RUN_NUMBER"
      - name: Verify the bundle
        run: |
          lipo -archs dist/Vien.app/Contents/MacOS/Vien | grep -q "x86_64 arm64\|arm64 x86_64"
          if [ -n "${{ secrets.SIGN_IDENTITY }}" ]; then spctl --assess --type execute --verbose=2 dist/Vien.app; fi
          dist/Vien.app/Contents/MacOS/Vien --export html README.md /tmp/readme.html && test -s /tmp/readme.html
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.SIGN_IDENTITY != '' }}
        run: |
          {
            echo "Universal build (Apple silicon and Intel), macOS 15 or later."
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "**First launch.** This build is not notarized by Apple, so macOS blocks it the first time. Move Vien to Applications, try to open it once (macOS will refuse), then go to **System Settings > Privacy & Security**, scroll to Security, and click **Open Anyway** next to Vien. Control-clicking the app no longer works on macOS Sequoia. Afterwards it opens normally, and Vien updates itself from here on."
            fi
          } > dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/Vien-*.zip dist/Vien-*.dmg dist/appcast.json \
            --title "Vien ${GITHUB_REF_NAME#native-v}" --notes-file dist/notes.md --generate-notes
