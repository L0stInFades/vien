name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  macos:
    name: Signed macOS release
    runs-on: macos-14
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MARKTEXT_EXIT_ON_ERROR: 1

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Ensure signing secrets exist
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce latest package declarations
        run: pnpm run deps:check-latest

      - name: Run Biome
        run: pnpm exec biome check src/

      - name: Run unit tests
        run: pnpm run unit

      - name: Run CommonMark and GFM specs
        run: pnpm run test:specs

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run Electron end-to-end tests
        run: pnpm exec playwright test -c test/e2e/playwright.config.js test/e2e

      - name: Build and publish macOS release
        run: pnpm exec electron-vite build && pnpm exec electron-builder build --mac --publish always

      - name: Smoke test packaged macOS app
        run: pnpm run verify:mac-bundle

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vien-macos-release
          path: |
            build/*.dmg
            build/*-mac.zip
            build/latest-mac.yml
            build/*.blockmap
